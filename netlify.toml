# Netlify Configuration for HOOR FAB React Vite SPA
[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Route all non-asset requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Standard HTTP headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Immutable caching for hashed assets in /assets/
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images caching
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
