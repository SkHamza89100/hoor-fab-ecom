<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <radialGradient id="mariaAtmosphere" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1E2822" />
      <stop offset="45%" stop-color="#121815" />
      <stop offset="85%" stop-color="#0A0E0C" />
      <stop offset="100%" stop-color="#050706" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#E5CFA0" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#C9A96E" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mintLawn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F4EE" />
      <stop offset="35%" stop-color="#D2E8DD" />
      <stop offset="70%" stop-color="#AECDBF" />
      <stop offset="100%" stop-color="#80A896" />
    </linearGradient>
    <linearGradient id="sageDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A46" />
      <stop offset="50%" stop-color="#1F4232" />
      <stop offset="100%" stop-color="#142C21" />
    </linearGradient>
    <linearGradient id="sheerMintDupatta" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F2FAF6" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#D7EFE4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="zariGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="40%" stop-color="#E2C68A" />
      <stop offset="80%" stop-color="#C9A96E" />
      <stop offset="100%" stop-color="#8F7138" />
    </linearGradient>
    <linearGradient id="skin" x1="30%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F3D5C0" />
      <stop offset="100%" stop-color="#D0A485" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#mariaAtmosphere)" />
  <rect width="600" height="800" fill="url(#goldGlow)" />

  <!-- Studio Frame & Arch -->
  <path d="M 50 740 L 50 220 C 50 110, 160 50, 300 30 C 440 50, 550 110, 550 220 L 550 740 Z" stroke="url(#zariGold)" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>
  <circle cx="300" cy="46" r="4" fill="url(#zariGold)" opacity="0.8"/>

  <!-- Model Silhouette & Posture -->
  <g transform="translate(300, 160)">
    <!-- Head / Hair -->
    <path d="M -24 -45 C -28 -72, 28 -72, 24 -45 C 22 -32, 18 -15, 0 -12 C -18 -15, -22 -32, -24 -45 Z" fill="#151210" />
    <!-- Face / Neck -->
    <path d="M -14 -40 C -14 -20, 14 -20, 14 -40 C 14 -50, -14 -50, -14 -40 Z" fill="url(#skin)" />
    <path d="M -9 -22 L 9 -22 L 12 8 L -12 8 Z" fill="url(#skin)" />
    <!-- Gold Jhumka Earrings -->
    <circle cx="-16" cy="-30" r="2.5" fill="url(#zariGold)"/>
    <path d="M -18 -26 L -14 -26 L -16 -18 Z" fill="url(#zariGold)"/>
    <circle cx="16" cy="-30" r="2.5" fill="url(#zariGold)"/>
    <path d="M 14 -26 L 18 -26 L 16 -18 Z" fill="url(#zariGold)"/>
  </g>

  <!-- Maria B Luxury Embroidered Pakistani Kameez -->
  <g transform="translate(300, 210)">
    <!-- Base Kurta Body -->
    <path d="M -48 -22 L -88 78 L -62 90 L -46 25 L -56 265 L 56 265 L 46 25 L 62 90 L 88 78 L 48 -22 Z" fill="url(#mintLawn)" stroke="url(#zariGold)" stroke-width="1.5"/>

    <!-- Neckline Cutwork & Resham Embroidery -->
    <path d="M -22 -22 C -22 18, 22 18, 22 -22 Z" fill="#FAF6EE" stroke="url(#zariGold)" stroke-width="2"/>
    <path d="M 0 16 L 0 110" stroke="url(#zariGold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Antique Tilla Buttons & Placket Motif -->
    <circle cx="0" cy="35" r="3" fill="url(#zariGold)"/>
    <circle cx="0" cy="55" r="3" fill="url(#zariGold)"/>
    <circle cx="0" cy="75" r="3" fill="url(#zariGold)"/>
    <circle cx="0" cy="95" r="3" fill="url(#zariGold)"/>

    <!-- Intricate Schiffli & Floral Resham Panels on Daman -->
    <rect x="-56" y="215" width="112" height="50" fill="url(#sageDeep)" stroke="url(#zariGold)" stroke-width="1.8"/>
    <!-- Scalloped Organza Border -->
    <path d="M -56 265 Q -42 276, -28 265 Q -14 276, 0 265 Q 14 276, 28 265 Q 42 276, 56 265" fill="none" stroke="url(#zariGold)" stroke-width="3"/>
    <!-- Delicate Embroidery Vines on Daman -->
    <path d="M -48 232 Q -24 220, 0 232 Q 24 220, 48 232" fill="none" stroke="url(#zariGold)" stroke-width="1.2" stroke-dasharray="4 2"/>
    <circle cx="-32" cy="245" r="3.5" fill="url(#zariGold)"/>
    <circle cx="0" cy="245" r="3.5" fill="url(#zariGold)"/>
    <circle cx="32" cy="245" r="3.5" fill="url(#zariGold)"/>

    <!-- Silk Trousers Beneath -->
    <path d="M -44 265 L -36 395 L -10 395 L -12 265 Z" fill="url(#sageDeep)" stroke="url(#zariGold)" stroke-width="1.2"/>
    <path d="M 12 265 L 10 395 L 36 395 L 44 265 Z" fill="url(#sageDeep)" stroke="url(#zariGold)" stroke-width="1.2"/>
    <line x1="-36" y1="385" x2="-10" y2="385" stroke="url(#zariGold)" stroke-width="2"/>
    <line x1="10" y1="385" x2="36" y2="385" stroke="url(#zariGold)" stroke-width="2"/>

    <!-- Elegant Bell Sleeves with Cutwork -->
    <path d="M -88 78 L -98 135 L -65 145 L -62 90 Z" fill="url(#mintLawn)" stroke="url(#zariGold)" stroke-width="1.4"/>
    <path d="M -98 135 Q -82 145, -65 145" stroke="url(#zariGold)" stroke-width="2.5" fill="none"/>
    <path d="M 88 78 L 98 135 L 65 145 L 62 90 Z" fill="url(#mintLawn)" stroke="url(#zariGold)" stroke-width="1.4"/>
    <path d="M 65 145 Q 82 145, 98 135" stroke="url(#zariGold)" stroke-width="2.5" fill="none"/>

    <!-- Dramatic Flowing Organza Dupatta Drape -->
    <path d="M -30 -15 C -95 10, -145 95, -125 210 C -110 310, -60 380, -90 440 L -140 435 C -175 320, -160 160, -80 20 Z" fill="url(#sheerMintDupatta)" stroke="url(#zariGold)" stroke-width="1.5"/>
    <path d="M 40 -15 C 110 20, 160 120, 145 250 C 135 340, 165 410, 130 440 L 95 435 C 120 370, 95 280, 50 180 Z" fill="url(#sheerMintDupatta)" stroke="url(#zariGold)" stroke-width="1.4"/>
  </g>

  <!-- Footwear & Grounding -->
  <g transform="translate(300, 608)">
    <ellipse cx="-23" cy="2" rx="14" ry="4" fill="url(#zariGold)"/>
    <ellipse cx="23" cy="2" rx="14" ry="4" fill="url(#zariGold)"/>
  </g>

  <!-- Typography & Collection Label -->
  <line x1="120" y1="710" x2="480" y2="710" stroke="url(#zariGold)" stroke-opacity="0.45" stroke-width="1"/>
  <text x="300" y="736" text-anchor="middle" fill="#C9A96E" font-family="Georgia, serif" font-size="12" letter-spacing="4">HOOR FAB COUTURE</text>
  <text x="300" y="762" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="20" font-weight="600" letter-spacing="2">PAKISTANI SUITS</text>
</svg>
