<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <radialGradient id="pinkAtmosphere" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#380F1E" />
      <stop offset="40%" stop-color="#240712" />
      <stop offset="85%" stop-color="#120309" />
      <stop offset="100%" stop-color="#060103" />
    </radialGradient>
    <radialGradient id="bridalGoldGlow" cx="50%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#FFE0A3" stop-opacity="0.38" />
      <stop offset="55%" stop-color="#C9A96E" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0" />
    </radialGradient>
    <!-- Royal Magenta & Crimson Pink Silk -->
    <linearGradient id="royalPinkSilk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9286C" />
      <stop offset="30%" stop-color="#B81754" />
      <stop offset="70%" stop-color="#8F0D3F" />
      <stop offset="100%" stop-color="#620529" />
    </linearGradient>
    <!-- Opulent Zardozi Pure Gold Shimmer -->
    <linearGradient id="zardoziGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="30%" stop-color="#F2D794" />
      <stop offset="70%" stop-color="#D4AF57" />
      <stop offset="100%" stop-color="#9C792E" />
    </linearGradient>
    <!-- Double Drape Bridal Sheer Gold Net Dupatta -->
    <linearGradient id="sheerBridalGold" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFDF5" stop-opacity="0.82" />
      <stop offset="45%" stop-color="#F6E4BA" stop-opacity="0.58" />
      <stop offset="100%" stop-color="#D4AF57" stop-opacity="0.38" />
    </linearGradient>
    <linearGradient id="skin" x1="30%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F3D5C0" />
      <stop offset="100%" stop-color="#D0A485" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#pinkAtmosphere)" />
  <rect width="600" height="800" fill="url(#bridalGoldGlow)" />

  <!-- Studio Frame & Regal Arch -->
  <path d="M 50 740 L 50 220 C 50 110, 160 50, 300 30 C 440 50, 550 110, 550 220 L 550 740 Z" stroke="url(#zardoziGold)" stroke-opacity="0.45" stroke-width="1.8" fill="none"/>
  <circle cx="300" cy="46" r="4.5" fill="url(#zardoziGold)" opacity="0.9"/>

  <!-- Model Posture & Bridal Jewelry -->
  <g transform="translate(300, 150)">
    <!-- Ornate Bridal Bun & Hair Adornments -->
    <circle cx="0" cy="-52" r="18" fill="#140A0D"/>
    <path d="M -26 -44 C -30 -70, 30 -70, 26 -44 C 24 -28, 18 -14, 0 -12 C -18 -14, -24 -28, -26 -44 Z" fill="#140A0D"/>
    <!-- Face / Neck -->
    <path d="M -14 -36 C -14 -18, 14 -18, 14 -36 C 14 -46, -14 -46, -14 -36 Z" fill="url(#skin)"/>
    <path d="M -9 -18 L 9 -18 L 11 12 L -11 12 Z" fill="url(#skin)"/>

    <!-- Royal Matha Patti & Maang Tikka -->
    <line x1="0" y1="-50" x2="0" y2="-34" stroke="url(#zardoziGold)" stroke-width="2"/>
    <circle cx="0" cy="-34" r="3.5" fill="url(#zardoziGold)"/>
    <path d="M -22 -44 Q 0 -48, 22 -44" stroke="url(#zardoziGold)" stroke-width="2" fill="none"/>

    <!-- Heavy Jhumkas & Nose Ring (Nath) -->
    <circle cx="-17" cy="-24" r="3.5" fill="url(#zardoziGold)"/>
    <path d="M -19 -20 L -15 -20 L -17 -10 Z" fill="url(#zardoziGold)"/>
    <circle cx="17" cy="-24" r="3.5" fill="url(#zardoziGold)"/>
    <path d="M 15 -20 L 19 -20 L 17 -10 Z" fill="url(#zardoziGold)"/>
    <circle cx="7" cy="-25" r="4.5" fill="none" stroke="url(#zardoziGold)" stroke-width="1.2"/>

    <!-- Grand Kundan & Polki Choker Necklace -->
    <path d="M -11 -4 Q 0 6, 11 -4" stroke="url(#zardoziGold)" stroke-width="3" fill="none"/>
    <path d="M -14 2 Q 0 16, 14 2" stroke="url(#zardoziGold)" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Pink Colour Full Woman Lehenga Choli -->
  <g transform="translate(300, 200)">
    <!-- 16-Kalidar Flared Grand Lehenga Skirt -->
    <path d="M -46 80 L 46 80 L 195 405 L -195 405 Z" fill="url(#royalPinkSilk)" stroke="url(#zardoziGold)" stroke-width="2"/>

    <!-- Kali Seam Lines & Intricate Zardozi Butis -->
    <line x1="-36" y1="80" x2="-152" y2="405" stroke="url(#zardoziGold)" stroke-width="1.4" stroke-opacity="0.75"/>
    <line x1="-24" y1="80" x2="-102" y2="405" stroke="url(#zardoziGold)" stroke-width="1.4" stroke-opacity="0.75"/>
    <line x1="-12" y1="80" x2="-52" y2="405" stroke="url(#zardoziGold)" stroke-width="1.4" stroke-opacity="0.75"/>
    <line x1="0" y1="80" x2="0" y2="405" stroke="url(#zardoziGold)" stroke-width="1.8" stroke-opacity="0.85"/>
    <line x1="12" y1="80" x2="52" y2="405" stroke="url(#zardoziGold)" stroke-width="1.4" stroke-opacity="0.75"/>
    <line x1="24" y1="80" x2="102" y2="405" stroke="url(#zardoziGold)" stroke-width="1.4" stroke-opacity="0.75"/>
    <line x1="36" y1="80" x2="152" y2="405" stroke="url(#zardoziGold)" stroke-width="1.4" stroke-opacity="0.75"/>

    <!-- Floral Marodi Gold Motifs inside Kalis -->
    <g fill="url(#zardoziGold)">
      <circle cx="-110" cy="300" r="4"/><circle cx="-65" cy="270" r="4"/><circle cx="-25" cy="240" r="4"/>
      <circle cx="110" cy="300" r="4"/><circle cx="65" cy="270" r="4"/><circle cx="25" cy="240" r="4"/>
      <circle cx="0" cy="220" r="4.5"/><circle cx="0" cy="300" r="5"/>
    </g>

    <!-- Massive Regal Gold Embroidered Zari Daman (Bottom Border) -->
    <path d="M -184 345 L 184 345 L 195 405 L -195 405 Z" fill="url(#zardoziGold)" fill-opacity="0.32" stroke="url(#zardoziGold)" stroke-width="2.5"/>
    <line x1="-184" y1="345" x2="184" y2="345" stroke="url(#zardoziGold)" stroke-width="2.5"/>
    <line x1="-190" y1="375" x2="190" y2="375" stroke="url(#zardoziGold)" stroke-width="2"/>
    <line x1="-195" y1="405" x2="195" y2="405" stroke="url(#zardoziGold)" stroke-width="3"/>

    <!-- Heavy Embroidered Blouse / Choli -->
    <path d="M -44 -18 L -82 62 L -58 74 L -42 16 L -38 65 L 38 65 L 42 16 L 58 74 L 82 62 L 44 -18 Z" fill="url(#royalPinkSilk)" stroke="url(#zardoziGold)" stroke-width="2"/>
    <!-- Deep Sweetheart Neckline with Dabka Border -->
    <path d="M -22 -18 Q -10 -4, 0 4 Q 10 -4, 22 -18 Z" fill="url(#zardoziGold)" fill-opacity="0.35" stroke="url(#zardoziGold)" stroke-width="2"/>
    <path d="M -30 -16 Q 0 25, 30 -16" stroke="url(#zardoziGold)" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="35" r="4.5" fill="url(#zardoziGold)"/>
    <circle cx="-18" cy="45" r="3.5" fill="url(#zardoziGold)"/>
    <circle cx="18" cy="45" r="3.5" fill="url(#zardoziGold)"/>
    <line x1="-38" y1="62" x2="38" y2="62" stroke="url(#zardoziGold)" stroke-width="3"/>

    <!-- Midriff Exposed Area -->
    <path d="M -36 65 L 36 65 L 46 80 L -46 80 Z" fill="url(#skin)"/>

    <!-- Ornate Double-Draped Bridal Dupatta with Scalloped Kiran Borders -->
    <path d="M -35 -14 C -120 20, -170 120, -155 240 C -140 330, -95 400, -135 440 L -175 435 C -205 320, -185 160, -95 15 Z" fill="url(#sheerBridalGold)" stroke="url(#zardoziGold)" stroke-width="1.8"/>
    <!-- Head Veil / Sheer Dupatta Pallu -->
    <path d="M 35 -14 C 115 15, 175 120, 160 250 C 145 340, 175 410, 140 440 L 105 435 C 130 365, 110 270, 55 170 Z" fill="url(#sheerBridalGold)" stroke="url(#zardoziGold)" stroke-width="1.6"/>
  </g>

  <!-- Grounding -->
  <g transform="translate(300, 608)">
    <ellipse cx="-55" cy="2" rx="16" ry="4" fill="url(#zardoziGold)"/>
    <ellipse cx="55" cy="2" rx="16" ry="4" fill="url(#zardoziGold)"/>
  </g>

  <!-- Typography & Collection Label -->
  <line x1="120" y1="710" x2="480" y2="710" stroke="url(#zardoziGold)" stroke-opacity="0.45" stroke-width="1"/>
  <text x="300" y="736" text-anchor="middle" fill="#C9A96E" font-family="Georgia, serif" font-size="12" letter-spacing="4">ROYAL HEIRLOOM COUTURE</text>
  <text x="300" y="762" text-anchor="middle" fill="#FAF6EE" font-family="Georgia, serif" font-size="20" font-weight="600" letter-spacing="2">BRIDAL WEAR · PINK LEHENGA</text>
</svg>
